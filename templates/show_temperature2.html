{% extends 'base.html' %}

{% block title %}即時溫溼度顯示{% endblock %}

{% block content %}
    <h4 class="mb-3 text-center">目前溫溼度<span class="badge bg-secondary ms-2 panel_time">10秒後更新</span></h4>
    <div class="card">
        <div class="card-body p-4">
            <div class="row g-3 justify-content-center text-center">
                <div class="col-md-4">
                    <label class="form-label text-muted" for="temperature">目前溫度</label>
                    <input type="text" class="form-control text-center fs-4" id="temperature" value="" disabled>
                </div>
                <div class="col-md-4">
                    <label class="form-label text-muted" for="humidity">目前濕度</label>
                    <input type="text" class="form-control text-center fs-4" id="humidity" value="" disabled>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block extra_script %}
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(function () {
            refresh();
            setInterval(countdown, 1000); // 每隔1秒更新倒數計時
        });

        var timer = 10;
        function countdown() {
            timer--;
            if (timer <= 0) {
                timer = 10;
                refresh();
            }
            $(".panel_time").text(timer + "秒後更新");
        }

        function refresh() {
            $.get("/show_temperature_API", function (data) {
                if (data.length > 0) {
                    $("#temperature").val(data[0].temperature);
                    $("#humidity").val(data[0].humidity);
                }
            }).fail(function () {
                $("#temperature").val("無法取得");
                $("#humidity").val("無法取得");
            });
        }
    </script>
{% endblock %}
