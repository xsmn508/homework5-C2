{% extends 'base.html' %}

{% block title %}即時溫溼度顯示{% endblock %}

{% block extra_head %}
    <meta http-equiv="refresh" content="10">
{% endblock %}

{% block content %}
    <h4 class="mb-3 text-center">目前溫溼度-github更改測試<span class="badge bg-secondary ms-2">每 10 秒自動刷新</span></h4>
    <div class="card">
        <div class="card-body p-4">
            <div class="row g-3 justify-content-center text-center">
                <div class="col-md-4">
                    <label class="form-label text-muted" for="temperature">目前溫度</label>
                    <input type="text" class="form-control text-center fs-4" id="temperature" value="{{ data.temperature }}" disabled>
                </div>
                <div class="col-md-4">
                    <label class="form-label text-muted" for="humidity">目前濕度</label>
                    <input type="text" class="form-control text-center fs-4" id="humidity" value="{{ data.humidity }}" disabled>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
